<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saaket's Book Blog</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            background-color: #f9f9f9;
        }
        header {
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

            color: #111;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;

            background: white;
            padding: 30px;

            box-shadow: 0 4px 6px rgba(0,0,0,0.05);

        }
        .footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: #888;

        }
